name: Mercedes Prototype CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy-staging:
    name: Deploy to Staging & Production
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: GitHub Pages Deployment / Static Host Simulation
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
